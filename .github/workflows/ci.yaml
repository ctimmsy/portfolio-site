name: CI

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    paths:
      - "public/**"
      - "src/**"
      - "astro.config.mjs"
      - "package.json"
      - "package-lock.json"

jobs:
  build-check:
    name: Build Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: install dependencies
        run: npm ci

      - name: build static site
        run: npm run build
